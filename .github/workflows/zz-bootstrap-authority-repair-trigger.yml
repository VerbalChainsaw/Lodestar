name: trigger bootstrap authority repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/lodestar-1.4.2-bootstrap-authority-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/lodestar-1.4.2-bootstrap-authority-repair
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - name: Extract and execute guarded repair script
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/zz-bootstrap-authority-repair.yml', 'utf8');
          const match = /node --input-type=module <<'NODE'\n([\s\S]*?)\n          NODE\n/.exec(workflow);
          if (!match) throw new Error('Could not extract guarded repair script');
          await writeFile('.bootstrap-authority-repair.mjs', match[1].replace(/^          /gmu, ''), 'utf8');
          NODE
          node .bootstrap-authority-repair.mjs
          rm .bootstrap-authority-repair.mjs
      - name: Align schema and flatten authority transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const replaceOnce = (text, before, after, label) => {
            const count = text.split(before).length - 1;
            assert.equal(count, 1, `${label}: expected one match, found ${count}`);
            return text.replace(before, after);
          };

          let builder = await readFile('scripts/build-managed-assets.mjs', 'utf8');
          builder = replaceOnce(builder,
            'if (bootstrap?.version !== 2 || typeof bootstrap.text !== "string"',
            'if (bootstrap?.version !== 3 || typeof bootstrap.text !== "string"',
            'managed bootstrap schema gate');
          await writeFile('scripts/build-managed-assets.mjs', builder, 'utf8');

          let state = await readFile('src/agent-state.mjs', 'utf8');
          state = replaceOnce(state,
            '// The budget belongs to whoever reads the projection, not to Lodestar. 24 KiB is a',
            '// The budget belongs to whoever reads the projection, not to Lodestar. 16 KiB is a',
            'startup budget comment');
          state = replaceOnce(state,
            'export const STARTUP_BYTES = 12 * 1024;',
            'export const STARTUP_BYTES = 16 * 1024;',
            'startup default budget');
          const helperPattern = /function startupGovernance\(record\) \{[\s\S]*?\n\}\n\nconst startupDecisions = \(state\) => \(\{\n  enabled: state\.enabled, projection: state\.projection,\n\}\);/u;
          assert.match(state, helperPattern, 'startup projection helpers are missing');
          state = state.replace(helperPattern, `function startupGovernance(record) {
  const { data } = record;
  const rules = data.sections.flatMap((section) => section.rules);
  return { id: record.id, kind: record.kind, required: true,
    text: [...rules, ...data.recovery_invariants].join("\\n") };
}
const startupDecisions = ({ enabled, projection }) => ({ enabled, projection });`);
          await writeFile('src/agent-state.mjs', state, 'utf8');

          let packageTest = await readFile('test/package.test.mjs', 'utf8');
          packageTest = replaceOnce(packageTest,
            '  assert.match(payload.bootstrap.text, /truncated or incomplete/u);',
            '  assert.equal(payload.bootstrap.version, 3);\n'
              + '  assert.match(payload.bootstrap.text, /retry the same startup operation in the same session/iu);',
            'bootstrap package test');
          await writeFile('test/package.test.mjs', packageTest, 'utf8');

          let stateTest = await readFile('test/agent-state.test.mjs', 'utf8');
          stateTest = replaceOnce(stateTest,
            '  assert.ok(first.value.data.required[0].data.sections\n'
              + '    .some(({ id }) => id === "workflow-routing"));\n'
              + '  assert.ok(first.value.data.required[0].data.sections\n'
              + '    .some(({ id }) => id === "startup-completeness"));\n'
              + '  assert.equal(first.value.data.authority_complete, true);',
            '  assert.match(first.value.data.required[0].text, /invoke both codeplan and center-audit/iu);\n'
              + '  assert.match(first.value.data.required[0].text, /same agent session/iu);\n'
              + '  assert.equal(first.value.data.authority_complete, true);',
            'agent-state startup authority assertions');
          await writeFile('test/agent-state.test.mjs', stateTest, 'utf8');

          let pluginTest = await readFile('test/plugin.test.mjs', 'utf8');
          pluginTest = replaceOnce(pluginTest,
            '  assert.equal(governance.data.v, 2);\n'
              + '  assert.equal(governance.data.sections.length, 11);\n'
              + '  assert.ok(governance.data.sections.find(({ id }) => id === "workflow-routing"));\n'
              + '  assert.ok(governance.data.sections.find(({ id }) => id === "startup-completeness"));\n'
              + '  assert.equal(projection.authority_complete, true);',
            '  assert.equal(governance.required, true);\n'
              + '  assert.match(governance.text, /invoke both codeplan and center-audit/iu);\n'
              + '  assert.match(governance.text, /same agent session/iu);\n'
              + '  assert.equal(projection.authority_complete, true);',
            'plugin startup authority assertions');
          await writeFile('test/plugin.test.mjs', pluginTest, 'utf8');

          let retryTest = await readFile('test/bootstrap-authority.test.mjs', 'utf8');
          retryTest = replaceOnce(retryTest,
            'import { AGENT_BOOTSTRAP } from "../src/bootstrap.mjs";',
            'import { AGENT_BOOTSTRAP, REQUIRED_GOVERNANCE } from "../src/bootstrap.mjs";',
            'bootstrap test imports');
          retryTest = replaceOnce(retryTest,
            '  assert.ok(Buffer.byteLength(retry.text, "utf8") <= 12 * 1024);',
            '  assert.ok(Buffer.byteLength(retry.text, "utf8") <= 16 * 1024);\n'
              + '  const delivered = retry.value.data.required[0].text;\n'
              + '  for (const section of REQUIRED_GOVERNANCE.data.sections) {\n'
              + '    for (const rule of section.rules) assert.ok(delivered.includes(rule));\n'
              + '  }\n'
              + '  for (const invariant of REQUIRED_GOVERNANCE.data.recovery_invariants) {\n'
              + '    assert.ok(delivered.includes(invariant));\n'
              + '  }',
            'bootstrap retry transport assertion');
          await writeFile('test/bootstrap-authority.test.mjs', retryTest, 'utf8');

          let changelog = await readFile('CHANGELOG.md', 'utf8');
          changelog = changelog.replace(
            'use a 12 KiB default envelope',
            'use a 16 KiB default envelope with flattened authority transport',
          );
          await writeFile('CHANGELOG.md', changelog, 'utf8');
          NODE
      - name: Generate managed artifacts and release card
        run: |
          npm run assets:build
          node scripts/build-release-social.mjs 1.4.2
      - name: Focused bootstrap and governance checks
        run: node --test test/bootstrap-authority.test.mjs test/agent-state.test.mjs test/plugin.test.mjs test/package.test.mjs
      - name: Full repository and package validation
        run: |
          npm test
          npm run pack:check
          git diff --check
      - name: Commit repaired source and generated surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Lodestar 1.4.2: repair bootstrap authority and frozen capability"
          git push origin HEAD:codex/lodestar-1.4.2-bootstrap-authority-repair
