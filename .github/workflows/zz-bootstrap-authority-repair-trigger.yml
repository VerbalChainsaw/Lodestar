name: trigger bootstrap authority repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - codex/lodestar-1.4.2-bootstrap-authority-repair

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/lodestar-1.4.2-bootstrap-authority-repair
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - name: Extract and execute guarded repair script
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const workflow = await readFile('.github/workflows/zz-bootstrap-authority-repair.yml', 'utf8');
          const match = /node --input-type=module <<'NODE'\n([\s\S]*?)\n          NODE\n/.exec(workflow);
          if (!match) throw new Error('Could not extract guarded repair script');
          const source = match[1].replace(/^          /gmu, '');
          await writeFile('.bootstrap-authority-repair.mjs', source, 'utf8');
          NODE
          node .bootstrap-authority-repair.mjs
          rm .bootstrap-authority-repair.mjs
      - name: Advance bootstrap schema contract to v3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const replaceOnce = (text, before, after, label) => {
            const count = text.split(before).length - 1;
            assert.equal(count, 1, `${label}: expected one match, found ${count}`);
            return text.replace(before, after);
          };

          let builder = await readFile('scripts/build-managed-assets.mjs', 'utf8');
          builder = replaceOnce(builder,
            'if (bootstrap?.version !== 2 || typeof bootstrap.text !== "string"',
            'if (bootstrap?.version !== 3 || typeof bootstrap.text !== "string"',
            'managed bootstrap schema gate');
          await writeFile('scripts/build-managed-assets.mjs', builder, 'utf8');

          let packageTest = await readFile('test/package.test.mjs', 'utf8');
          packageTest = replaceOnce(packageTest,
            '  assert.match(payload.bootstrap.text, /truncated or incomplete/u);',
            '  assert.equal(payload.bootstrap.version, 3);\n'
              + '  assert.match(payload.bootstrap.text, /retry the same startup operation in the same session/iu);',
            'bootstrap package test');
          await writeFile('test/package.test.mjs', packageTest, 'utf8');
          NODE
      - name: Generate managed artifacts and release card
        run: |
          npm run assets:build
          node scripts/build-release-social.mjs 1.4.2
      - name: Focused bootstrap and governance checks
        run: node --test test/bootstrap-authority.test.mjs test/agent-state.test.mjs test/plugin.test.mjs test/package.test.mjs
      - name: Full repository and package validation
        run: |
          npm test
          npm run pack:check
          git diff --check
      - name: Commit repaired source and generated surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Lodestar 1.4.2: repair bootstrap authority and frozen capability"
          git push origin HEAD:codex/lodestar-1.4.2-bootstrap-authority-repair
