name: cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: npm test
      - run: npm run pack:check
      - run: npm pack --json
      - name: Resolve package artifact
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "PACKAGE=lodestar-agent-context-$version.tgz" >> $env:GITHUB_ENV
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix .package-smoke "./${{ env.PACKAGE }}"
      - name: Exercise the packed executable
        run: node scripts/smoke-packed-package.mjs .package-smoke/node_modules/lodestar-agent-context/lodestar.mjs
