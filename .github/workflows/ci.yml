name: cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: node install.mjs --dry-run --skip-codex
      - run: npm pack --dry-run
      - run: npm pack
      - name: Resolve package artifact
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "PACKAGE=lodestar-agent-context-$version.tgz" >> $env:GITHUB_ENV
      - run: node install.mjs --package "./${{ env.PACKAGE }}" --prefix .installer-smoke --home .installer-state --skip-codex
      - run: npm install --prefix .package-smoke "./${{ env.PACKAGE }}"
      - run: npm --prefix .package-smoke exec -- agentctx init --home ../.package-smoke-state
      - run: npm --prefix .package-smoke exec -- agentctx doctor --home ../.package-smoke-state
      - run: npm --prefix .package-smoke exec -- lodestar-performance --quick --iterations 3 --warmups 1 --json
