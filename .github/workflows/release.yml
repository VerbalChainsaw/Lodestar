name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: npm test
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: npm test
      - run: npm run pack:check
      - run: npm pack --json
      - name: Resolve package artifact
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "PACKAGE=lodestar-agent-context-$version.tgz" >> $env:GITHUB_ENV
      - run: npm install --ignore-scripts --prefix .package-smoke "./${{ env.PACKAGE }}"
      - name: Exercise the packed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $database = Join-Path $PWD ".package-smoke-state/lodestar.db"
          '{"id":"smoke","type":"note","name":"Smoke","scope":"global","content":{"state":"known","value":"packed"},"aliases":[],"links":[],"sources":[]}' |
            Set-Content -NoNewline -Encoding utf8 .package-smoke-record.json
          npm --prefix .package-smoke exec -- lodestar --help
          npm --prefix .package-smoke exec -- lodestar init --db "$database"
          npm --prefix .package-smoke exec -- lodestar put --file .package-smoke-record.json --db "$database"
          npm --prefix .package-smoke exec -- lodestar get smoke --db "$database"
          npm --prefix .package-smoke exec -- lodestar doctor --db "$database"
          npm --prefix .package-smoke exec -- lodestar export --db "$database"

  publish:
    needs:
      - codeql
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - name: Verify tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -f "CHANGELOG.md"
      - run: npm test
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          package="$(npm pack --silent)"
          test -f "${package}"
          sha256sum "${package}" > SHA256SUMS.txt
          echo "PACKAGE=${package}" >> "${GITHUB_ENV}"
      - name: Attest release package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.PACKAGE }}
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "${PACKAGE}" \
            SHA256SUMS.txt \
            --title "Lodestar ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
