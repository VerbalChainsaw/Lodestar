name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: npm test
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
      - run: npm test
      - run: npm run pack:check
      - run: npm pack --json
      - name: Resolve package artifact
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "PACKAGE=lodestar-agent-context-$version.tgz" >> $env:GITHUB_ENV
      - run: npm install --ignore-scripts --no-audit --no-fund --prefix .package-smoke "./${{ env.PACKAGE }}"
      - name: Exercise the packed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $database = Join-Path $PWD ".package-smoke-state/lodestar.db"
          '{"id":"smoke","type":"note","name":"Smoke","scope":"global","content":{"state":"known","value":"packed"},"aliases":[],"links":[],"sources":[]}' |
            Set-Content -NoNewline -Encoding utf8 .package-smoke-record.json
          npm --prefix .package-smoke exec -- lodestar --help
          npm --prefix .package-smoke exec -- lodestar put --file .package-smoke-record.json --db "$database"
          npm --prefix .package-smoke exec -- lodestar get smoke --db "$database"
          npm --prefix .package-smoke exec -- lodestar doctor --db "$database"
          npm --prefix .package-smoke exec -- lodestar export --db "$database"

  publish:
    needs:
      - codeql
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag and release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          grep -F "## ${version} - " CHANGELOG.md
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - run: npm test
      - run: npm run pack:check
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > .release-pack.json
          package="$(node -p "require('./.release-pack.json')[0].filename")"
          integrity="$(node -p "require('./.release-pack.json')[0].integrity")"
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          release_hero="docs/assets/lodestar-launch-hero.png"
          release_social="docs/assets/lodestar-v${version}-social.png"
          test -f "${package}"
          test -f "${release_hero}"
          test -f "${release_social}"
          sha256sum "${package}" > SHA256SUMS.txt
          {
            echo "PACKAGE=${package}"
            echo "PACKAGE_INTEGRITY=${integrity}"
            echo "PACKAGE_SPEC=${name}@${version}"
            echo "RELEASE_HERO=${release_hero}"
            echo "RELEASE_SOCIAL=${release_social}"
          } >> "${GITHUB_ENV}"
      - name: Publish exact package to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          registry_integrity() {
            npm view "${PACKAGE_SPEC}" dist.integrity --json 2>/dev/null |
              node -e '
                let text = "";
                process.stdin.on("data", chunk => { text += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const value = JSON.parse(text);
                    if (typeof value === "string") process.stdout.write(value);
                  } catch {}
                });
              '
          }

          remote="$(registry_integrity || true)"
          if [[ -n "${remote}" ]]; then
            test "${remote}" = "${PACKAGE_INTEGRITY}"
          else
            publish_status=0
            npm publish "./${PACKAGE}" \
              --ignore-scripts \
              --access public \
              --provenance ||
              publish_status=$?

            remote=""
            for _ in {1..10}; do
              remote="$(registry_integrity || true)"
              if [[ "${remote}" = "${PACKAGE_INTEGRITY}" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "${remote}" != "${PACKAGE_INTEGRITY}" ]]; then
              if [[ "${publish_status}" -ne 0 ]]; then
                exit "${publish_status}"
              fi
              exit 1
            fi
          fi
      - name: Attest release package provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ env.PACKAGE }}
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets=(
            "${PACKAGE}"
            SHA256SUMS.txt
            "${RELEASE_HERO}"
            "${RELEASE_SOCIAL}"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${release_assets[@]}" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Lodestar ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${release_assets[@]}" \
              --title "Lodestar ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          fi
